<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FanZora</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <div class="login-box">

    <h1>🏆 FanZora</h1>

    <h2>Welcome Back</h2>

    <input
      type="email"
      id="email"
      placeholder="Enter Email Address">

    <input
      type="password"
      id="password"
      placeholder="Enter Password">

    <button class="btn" onclick="loginUser()">
      Login
    </button>

    <p>Don't have an account?</p>

    <button class="btn secondary" onclick="goTo('signup.html')">
      Create Account
    </button>

    <br><br>

    <a href="index.html" style="color:#8b5cf6;text-decoration:none;">
      ← Back to Home
    </a>

  </div>
<script type="module" src="script.js"></script>
</body>

</html>
