<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - FanZora</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <div class="login-box">

    <h1>🏆 FanZora</h1>

    <h2>Create Your Account</h2>

    <input
      type="text"
      id="fullname"
      placeholder="Full Name">

    <input
      type="email"
      id="email"
      placeholder="Email Address">

    <input
      type="tel"
      id="mobile"
      placeholder="Mobile Number">

    <input
      type="password"
      id="password"
      placeholder="Password">

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm Password">

    <button class="btn" onclick="signupUser()">
      Create Account
    </button>

    <p>Already have an account?</p>

    <button class="btn secondary" onclick="goTo('login.html')">
      Login
    </button>

    <br><br>

    <a href="index.html" style="color:#8b5cf6;text-decoration:none;">
      ← Back to Home
    </a>

  </div>

  <script type="module" src="assets/js/script.js"></script>

</body>

</html>
